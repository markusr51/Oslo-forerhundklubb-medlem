<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hjelpetreneroppfølging – Oslo Førerhundklubb</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body>
<nav id="portalNav" aria-label="Hovedmeny"></nav>

<main>
<h1>Hjelpetreneroppfølging</h1>

<p id="status" role="status" aria-live="polite">
Laster …
</p>

<section aria-labelledby="openHeading">
<h2 id="openHeading">Åpne hjelpetrenerforespørsler</h2>
<div id="openRows"></div>
</section>

<section aria-labelledby="upcomingHeading">
<h2 id="upcomingHeading">Kommende hjelpetreneraktiviteter</h2>
<div id="upcomingRows"></div>
</section>
</main>

<script>
let me = null;

const openRows =
  document.getElementById("openRows");

const upcomingRows =
  document.getElementById("upcomingRows");

function esc(value) {
  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char])
    );
}

function timingText(row) {
  if (
    row.timing_type === "asap"
  ) {
    return "Så snart som mulig";
  }

  return (
    String(
      row.requested_date || ""
    ) +
    (
      row.requested_time
        ? " kl. " +
          String(
            row.requested_time
          ).slice(0, 5)
        : ""
    )
  );
}

async function invoke(body) {
  const {
    data,
    error
  } =
    await sb.functions.invoke(
      "helper-requests",
      {
        body
      }
    );

  if (error) {
    throw new Error(
      error.message
    );
  }

  if (!data?.success) {
    throw new Error(
      data?.error ||
      "Ukjent feil."
    );
  }

  return data;
}

function renderOpen(rows) {
  openRows.innerHTML =
    (rows || [])
      .map(
        row => `
          <article>
            <h3>${esc(row.help_type)}</h3>

            <p>
              Bruker:
              ${esc(row.requester_name || "Ukjent")}
            </p>

            <p>
              Sted:
              ${esc(row.location_text)}
            </p>

            <p>
              Ønsket tid:
              ${esc(timingText(row))}
            </p>

            ${
              row.comment
                ? `<p>Kommentar: ${esc(row.comment)}</p>`
                : ""
            }
          </article>
        `
      )
      .join("") ||
    "<p>Ingen åpne forespørsler.</p>";
}

function renderUpcoming(rows) {
  upcomingRows.innerHTML =
    (rows || [])
      .map(
        row => `
          <article>
            <h3>
              Hjelpetreneroppdrag –
              ${esc(row.help_type)}
            </h3>

            <p>
              Bruker:
              ${esc(row.requester_name || "Ukjent")}
            </p>

            <p>
              Hjelpetrener:
              ${esc(row.helper_name || "Ikke oppgitt")}
            </p>

            <p>
              Dato:
              ${esc(row.agreed_date || "")}
              ${
                row.agreed_time
                  ? " kl. " +
                    esc(
                      String(
                        row.agreed_time
                      ).slice(0,5)
                    )
                  : ""
              }
            </p>

            <p>
              Sted:
              ${esc(row.location_text)}
            </p>
          </article>
        `
      )
      .join("") ||
    "<p>Ingen kommende hjelpetreneraktiviteter.</p>";
}

(async () => {
  try {
    await requireSession();

    me =
      await getCurrentAppUser();

    await renderPortalNavigation({
      current:
        "helper-board-overview",
      me
    });

    const data =
      await invoke({
        action:
          "board_overview"
      });

    renderOpen(
      data.open || []
    );

    renderUpcoming(
      data.agreed || []
    );

    announce(
      "Oversikten er oppdatert."
    );

  } catch (error) {
    console.error(error);

    announce(
      "Kunne ikke åpne oversikten: " +
      (
        error?.message ||
        String(error)
      )
    );
  }
})();
</script>
</body>
</html>
