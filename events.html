<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arrangementer – Oslo Førerhundklubb</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="events.js"></script>
</head>
<body>
<header><img src="logo.png" alt="Oslo Førerhundklubb"><h1>Arrangementer</h1></header>
<nav aria-label="Hovedmeny">
<a href="members.html">Medlemmer</a>
<a href="events.html" aria-current="page">Arrangementer</a>
<a href="groups.html">Grupper og utvalg</a>
<a href="roles.html">Roller</a>
<a href="sms.html">SMS</a>
<a href="email.html">E-post</a>
<a href="admins.html">Brukere og tilganger</a>
<a href="history.html">Endringshistorikk</a>
<button type="button" onclick="logout()">Logg ut</button>
</nav>

<main>
<p id="status" class="status" role="status" aria-live="polite">Laster arrangementer …</p>

<p><a class="button" href="event-edit.html">Opprett nytt arrangement</a></p>

<section aria-labelledby="upcoming-heading">
<h2 id="upcoming-heading">Arrangementer</h2>
<table>
<caption>Registrerte arrangementer</caption>
<thead>
<tr>
<th>Dato</th>
<th>Arrangement</th>
<th>Tid</th>
<th>Sted</th>
<th>Status</th>
<th>Handling</th>
</tr>
</thead>
<tbody id="eventRows"></tbody>
</table>
</section>
</main>

<script>
function escapeHtml(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}

(async () => {
  await requireSession();

  const { data, error } = await sb
    .from("events")
    .select("id,title,event_date,end_date,start_time,end_time,location,status")
    .order("event_date", { ascending: true })
    .order("start_time", { ascending: true });

  if (error) {
    announce("Kunne ikke hente arrangementer: " + error.message);
    return;
  }

  eventRows.innerHTML = (data || []).map(e => `
    <tr>
      <td>${escapeHtml(norwegianDate(e.event_date))}${e.end_date && e.end_date !== e.event_date ? "–" + escapeHtml(norwegianDate(e.end_date)) : ""}</td>
      <td>${escapeHtml(e.title)}</td>
      <td>${escapeHtml(norwegianTime(e.start_time))}${e.end_time ? "–" + escapeHtml(norwegianTime(e.end_time)) : ""}</td>
      <td>${escapeHtml(e.location || "")}</td>
      <td>${escapeHtml(eventStatusText(e.status))}</td>
      <td><a href="event.html?id=${encodeURIComponent(e.id)}">Åpne</a></td>
    </tr>
  `).join("") || `<tr><td colspan="6">Ingen arrangementer registrert ennå.</td></tr>`;

  announce((data || []).length + " arrangement(er) lastet.");
})();
</script>
</body>
</html>
