<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hjelpetreneroversikt – Oslo Førerhundklubb</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head>
<body><nav id="portalNav" aria-label="Hovedmeny"></nav><main><h1>Hjelpetreneroversikt</h1>
<p id="status" class="status" role="status" aria-live="polite">Laster …</p>
<p><label for="yearSelect">År</label><br><select id="yearSelect"></select></p>
<p><button id="exportBtn" type="button">Eksporter oversikten som CSV for Excel</button></p>
<table><caption>Årsoversikt per hjelpetrener</caption><thead><tr><th>Hjelpetrener</th><th>Honorar</th><th>Kjøring</th><th>Utlegg</th><th>Totalt</th><th>Registreringer</th></tr></thead><tbody id="rows"></tbody></table>
</main><script>
let me=null,dataRows=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function money(v){return `${Number(v||0).toFixed(2)} kr`;}
async function load(){const {data,error}=await sb.rpc("admin_helper_year_overview",{target_year:Number(yearSelect.value)});if(error)return announce("Kunne ikke hente oversikten: "+error.message);dataRows=data||[];rows.innerHTML=dataRows.map(r=>`<tr><td>${esc(r.person_name)}</td><td>${esc(money(r.honor))}</td><td>${esc(money(r.mileage))}</td><td>${esc(money(r.expenses))}</td><td>${esc(money(r.total))}</td><td>${esc(r.entry_count)}</td></tr>`).join("")||'<tr><td colspan="6">Ingen registreringer.</td></tr>';announce("Hjelpetreneroversikten er klar.");}
exportBtn.onclick=()=>{const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;const lines=[["Hjelpetrener","Honorar","Kjøring","Utlegg","Totalt","Registreringer"].map(q).join(";"),...dataRows.map(r=>[r.person_name,r.honor,r.mileage,r.expenses,r.total,r.entry_count].map(q).join(";"))];const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`hjelpetreneroversikt-${yearSelect.value}.csv`;a.click();URL.revokeObjectURL(a.href);};
(async()=>{await requireSession();me=await getCurrentAppUser();if(!["admin","system_admin"].includes(me?.app_role)){location.replace("my-page.html");return;}await renderPortalNavigation({current:"helper-overview",me});const y=new Date().getFullYear();yearSelect.innerHTML=Array.from({length:5},(_,i)=>`<option>${y-2+i}</option>`).join("");yearSelect.value=String(y);yearSelect.onchange=load;await load();})();
</script></body></html>
