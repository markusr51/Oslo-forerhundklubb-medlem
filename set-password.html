<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opprett passord – Oslo Førerhundklubb</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body>
<header><h1>Opprett ditt passord</h1></header>
<main>
<p id="status" class="status" role="status" aria-live="polite">
Før du bruker medlemsportalen må du velge ditt eget passord.
</p>

<form id="passwordForm">
<p>
<label for="password1">Nytt passord</label><br>
<input id="password1" type="password" autocomplete="new-password" minlength="10" required>
</p>
<p>
<label for="password2">Gjenta nytt passord</label><br>
<input id="password2" type="password" autocomplete="new-password" minlength="10" required>
</p>
<button type="submit">Lagre passord og fortsett</button>
</form>
</main>

<script>
(async()=>{
  const session = await requireSession({allowPasswordSetup:true});
  if (!session) return;

  const {data,error} = await sb
    .from("app_users")
    .select("must_change_password,active")
    .eq("user_id",session.user.id)
    .maybeSingle();

  if (error || !data) {
    announce("Brukerkontoen kunne ikke kontrolleres.");
    passwordForm.hidden = true;
    return;
  }

  if (data.active === false) {
    await sb.auth.signOut();
    location.href = "index.html?disabled=1";
    return;
  }

  if (!data.must_change_password) {
    location.href = await portalHome();
  }
})();

passwordForm.onsubmit = async e=>{
  e.preventDefault();

  if (password1.value !== password2.value) {
    announce("Passordene er ikke like.");
    return;
  }

  if (password1.value.length < 10) {
    announce("Passordet må være minst 10 tegn.");
    return;
  }

  announce("Lagrer passord …");

  const {error} = await sb.auth.updateUser({
    password: password1.value
  });

  if (error) {
    announce("Kunne ikke lagre passordet: " + error.message);
    return;
  }

  const {data:{user}} = await sb.auth.getUser();

  const {error:flagError} = await sb
    .from("app_users")
    .update({
      must_change_password:false,
      first_login_completed_at:new Date().toISOString()
    })
    .eq("user_id",user.id);

  if (flagError) {
    announce("Passordet ble lagret, men førstegangsoppsettet kunne ikke fullføres. Kontakt administrator.");
    return;
  }

  announce("Passordet er lagret. Åpner medlemsportalen.");
  setTimeout(async()=>{
    location.href = await portalHome();
  },600);
};
</script>
</body>
</html>
