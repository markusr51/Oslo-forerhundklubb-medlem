<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logg inn – Oslo Førerhundklubb medlemsportal</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body>
<header><img src="logo.png" alt="Oslo Førerhundklubb"><h1>Medlemsportal</h1></header>
<main>
<h2>Logg inn</h2>
<p id="status" class="status" role="status" aria-live="polite">Bruk din portalbruker.</p>
<form id="loginForm">
<p><label for="email">E-post</label><br><input id="email" type="email" autocomplete="username" required></p>
<p><label for="password">Passord</label><br><input id="password" type="password" autocomplete="current-password" required></p>
<button type="submit">Logg inn</button>
</form>
</main>
<script>
document.getElementById('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  announce('Logger inn …');
  const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
  if(error){announce('Innlogging feilet: '+error.message); return;}
  location.href='members.html';
});
</script>
</body>
</html>
