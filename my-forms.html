<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GuideView – Førerhundportalen</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script src="config.js"></script>
<script src="app.js?v=0284"></script>
</head>
<body>
<header><img src="logo.png" alt="Oslo Førerhundklubb"></header>
<nav id="portalNav" aria-label="Hovedmeny"></nav>
<main id="main-content"><h1>Mine skjemaer</h1><p id="status" role="status" aria-live="polite"></p><div id="list"></div></main><script>const sb=window.sb||window.supabaseClient;async function invoke(body){const {data,error}=await sb.functions.invoke("forms-actions",{body});if(error){let m=error.message;try{const x=await error.context?.json();if(x?.error)m=x.error}catch(_){}throw Error(m)}if(data?.error)throw Error(data.error);return data}const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));</script><script>(async()=>{const s=await requireSession();if(!s)return;const me=await getCurrentAppUser();await renderPortalNavigation({current:"my-forms",me});const d=await invoke({action:"my_forms"});list.innerHTML=d.forms.length?d.forms.map(f=>`<article><h2>${esc(f.title)}</h2><p>${esc(f.description||"")}</p><p>${f.completed?"Besvart":"Ikke besvart"}</p>${f.completed?"":`<a href="form.html?id=${encodeURIComponent(f.id)}">Åpne skjema</a>`}</article>`).join(""):"<p>Du har ingen åpne skjemaer.</p>"})().catch(e=>status.textContent=e.message);</script></body></html>
