<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rediger arrangement – Oslo Førerhundklubb</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async()=>{
  try {
    await requireSession();
    const __accessUser = await getCurrentAppUser();

    if (
      !__accessUser ||
      !["admin","system_admin"].includes(__accessUser.app_role)
    ) {
      await sb.auth.signOut();
      location.replace("index.html?forbidden=1");
      return;
    }

    document.documentElement.dataset.adminAccess = "granted";
  } catch (error) {
    console.error("Administratortilgang kunne ikke bekreftes:", error);
    try { await sb.auth.signOut(); } catch (_) {}
    location.replace("index.html?forbidden=1");
  }
})();
</script>

<script src="events.js"></script>
</head>
<body>
<h2 class="main-menu-heading">Hovedmeny</h2>
<nav aria-label="Hovedmeny">
<a href="admin-dashboard.html">Oversikt</a>
<a href="events.html">Til arrangementer</a>
<a href="members.html">Medlemmer</a>
<a href="groups.html">Grupper og utvalg</a>
<a href="roles.html">Roller</a>
<a href="library.html">Dokumentbibliotek</a>
<a href="helper-settlement.html">Hjelpetreneroppgjør</a>
<button type="button" onclick="logout()">Logg ut</button>
</nav>

<main>
<h1 id="pageHeading">Opprett arrangement</h1>

<p id="status" class="status" role="status" aria-live="polite">Klar.</p>

<form id="eventForm" novalidate>
<p>
<label for="titleInput">Navn på arrangement</label><br>
<input id="titleInput" type="text" maxlength="200" required>
</p>

<p>
<label for="locationInput">Sted</label><br>
<input id="locationInput" type="text" maxlength="300">
</p>

<p>
<label for="descriptionInput">Beskrivelse</label><br>
<textarea id="descriptionInput" rows="10"></textarea>
</p>

<fieldset>
<legend>Startdato</legend>
<p>
<label for="eventDay">Dag</label>
<select id="eventDay"></select>

<label for="eventMonth">Måned</label>
<select id="eventMonth"></select>

<label for="eventYear">År</label>
<select id="eventYear"></select>
</p>
<p id="eventDateStatus" class="status" role="status" aria-live="polite"></p>
</fieldset>

<p>
<label for="multiDayToggle">
<input id="multiDayToggle" type="checkbox">
Flerdagsarrangement
</label>
</p>

<fieldset id="endDateFields" hidden>
<legend>Sluttdato</legend>
<p>
<label for="endDateDay">Dag</label>
<select id="endDateDay"></select>

<label for="endDateMonth">Måned</label>
<select id="endDateMonth"></select>

<label for="endDateYear">År</label>
<select id="endDateYear"></select>
</p>
<p id="endDateStatus" class="status" role="status" aria-live="polite"></p>
</fieldset>

<fieldset>
<legend>Starttid</legend>
<p>
<label for="startHour">Time</label>
<select id="startHour"></select>

<label for="startMinute">Minutt</label>
<select id="startMinute"></select>
</p>
<p id="startTimeStatus" class="status" role="status" aria-live="polite"></p>
</fieldset>

<fieldset>
<legend>Sluttid</legend>
<p>
<label for="endHour">Time</label>
<select id="endHour"></select>

<label for="endMinute">Minutt</label>
<select id="endMinute"></select>
</p>
<p id="endTimeStatus" class="status" role="status" aria-live="polite"></p>
<p>Velg «Ingen» under time hvis arrangementet ikke skal ha registrert sluttid.</p>
</fieldset>

<fieldset>
<legend>Påmeldingsfrist</legend>
<p>
<label for="deadlineEnabled">
<input id="deadlineEnabled" type="checkbox">
Arrangementet har påmeldingsfrist
</label>
</p>

<div id="deadlineFields" hidden>
<p>
<label for="deadlineDay">Dag</label>
<select id="deadlineDay"></select>

<label for="deadlineMonth">Måned</label>
<select id="deadlineMonth"></select>

<label for="deadlineYear">År</label>
<select id="deadlineYear"></select>
</p>
<p id="deadlineDateStatus" class="status" role="status" aria-live="polite"></p>
</div>
</fieldset>

<p>
<label for="statusSelect">Status</label><br>
<select id="statusSelect">
<option value="planned">Planlagt</option>
<option value="cancelled">Avlyst</option>
<option value="completed">Gjennomført</option>
</select>
</p>

<button type="submit" id="saveButton">Lagre arrangement</button>

<p id="formError" class="status" role="alert" aria-live="assertive" hidden></p>
</form>
</main>

<script>
const eventId = new URLSearchParams(window.location.search).get("id");

const form = document.getElementById("eventForm");
const pageHeading = document.getElementById("pageHeading");
const titleInput = document.getElementById("titleInput");
const locationInput = document.getElementById("locationInput");
const descriptionInput = document.getElementById("descriptionInput");
const multiDayToggle = document.getElementById("multiDayToggle");
const endDateFields = document.getElementById("endDateFields");
const deadlineEnabled = document.getElementById("deadlineEnabled");
const deadlineFields = document.getElementById("deadlineFields");
const statusSelect = document.getElementById("statusSelect");
const formError = document.getElementById("formError");
const saveButton = document.getElementById("saveButton");

function showFormError(message) {
  formError.textContent = message;
  formError.hidden = false;
  announce(message);
  formError.scrollIntoView({ block: "nearest" });
}

function clearFormError() {
  formError.textContent = "";
  formError.hidden = true;
}

function setDefaultEndTime() {
  document.getElementById("startHour").value = "18";
  document.getElementById("startMinute").value = "00";
  document.getElementById("endHour").value = "20";
  document.getElementById("endMinute").value = "00";
}

function copyStartDateToEndDate() {
  document.getElementById("endDateDay").value =
    document.getElementById("eventDay").value;
  document.getElementById("endDateMonth").value =
    document.getElementById("eventMonth").value;
  document.getElementById("endDateYear").value =
    document.getElementById("eventYear").value;
}

(async () => {
  await requireSession();

  populateDateSelects("event");
  populateDateSelects("endDate");
  populateDateSelects("deadline");
  populateTimeSelects("start", false, 18, 0);
  populateTimeSelects("end", true, 20, 0);

  wireSelectionStatus("event", "eventDateStatus", "date");
  wireSelectionStatus("endDate", "endDateStatus", "date");
  wireSelectionStatus("start", "startTimeStatus", "time");
  wireSelectionStatus("end", "endTimeStatus", "time", true);
  wireSelectionStatus("deadline", "deadlineDateStatus", "date");

  setDefaultEndTime();
  copyStartDateToEndDate();

  multiDayToggle.addEventListener("change", () => {
    endDateFields.hidden = !multiDayToggle.checked;
    if (multiDayToggle.checked) {
      copyStartDateToEndDate();
    }
  });

  deadlineEnabled.addEventListener("change", () => {
    deadlineFields.hidden = !deadlineEnabled.checked;
  });

  if (!eventId) return;

  pageHeading.textContent = "Rediger arrangement";
  announce("Laster arrangement …");

  const { data, error } = await sb
    .from("events")
    .select("*")
    .eq("id", eventId)
    .single();

  if (error) {
    showFormError("Kunne ikke hente arrangementet: " + error.message);
    form.hidden = true;
    return;
  }

  titleInput.value = data.title || "";
  locationInput.value = data.location || "";
  descriptionInput.value = data.description || "";
  setDateSelects("event", data.event_date);
  setTimeSelects("start", data.start_time, false);
  setTimeSelects("end", data.end_time, true);
  statusSelect.value = data.status || "planned";

  if (data.end_date && data.end_date !== data.event_date) {
    multiDayToggle.checked = true;
    endDateFields.hidden = false;
    setDateSelects("endDate", data.end_date);
  } else {
    multiDayToggle.checked = false;
    endDateFields.hidden = true;
    setDateSelects("endDate", data.event_date);
  }

  if (data.registration_deadline) {
    deadlineEnabled.checked = true;
    deadlineFields.hidden = false;
    setDateSelects("deadline", data.registration_deadline);
  }

  announce("Arrangementet er lastet.");
})();

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  clearFormError();
  saveButton.disabled = true;

  try {
    const title = titleInput.value.trim();

    if (!title) {
      showFormError("Du må skrive inn navn på arrangementet.");
      titleInput.focus();
      return;
    }

    const eventDate = getDateFromSelects("event");
    if (!eventDate) {
      showFormError("Startdatoen er ugyldig. Kontroller dag, måned og år.");
      return;
    }

    let endDate = null;
    if (multiDayToggle.checked) {
      endDate = getDateFromSelects("endDate");

      if (!endDate) {
        showFormError("Sluttdatoen er ugyldig. Kontroller dag, måned og år.");
        return;
      }

      if (endDate < eventDate) {
        showFormError("Sluttdato kan ikke være før startdato.");
        return;
      }
    }

    const deadline = deadlineEnabled.checked
      ? getDateFromSelects("deadline")
      : null;

    if (deadlineEnabled.checked && !deadline) {
      showFormError("Påmeldingsfristen er ugyldig. Kontroller dag, måned og år.");
      return;
    }

    const startTime = getTimeFromSelects("start");
    const endTime = getTimeFromSelects("end", true);

    if (!startTime) {
      showFormError("Du må velge starttid.");
      return;
    }

    const row = {
      title,
      location: locationInput.value.trim() || null,
      description: descriptionInput.value.trim() || null,
    allow_self_registration: allowSelfRegistration.checked,
    allow_guests: allowGuests.checked,
    max_guests: Number(maxGuests.value || 0),
    registration_form_enabled: registrationFormEnabled.checked,
      event_date: eventDate,
      end_date: multiDayToggle.checked ? endDate : null,
      start_time: startTime,
      end_time: endTime,
      registration_deadline: deadline,
      status: statusSelect.value
    };

    announce("Lagrer arrangement …");

    if (eventId) {
      const { error } = await sb
        .from("events")
        .update(row)
        .eq("id", eventId);

      if (error) {
        showFormError("Lagring feilet: " + error.message);
        return;
      }

      window.location.href =
        "event.html?id=" + encodeURIComponent(eventId);
      return;
    }

    const { data, error } = await sb
      .from("events")
      .insert(row)
      .select("id")
      .single();

    if (error || !data) {
      showFormError(
        "Oppretting feilet: " +
        (error?.message || "ukjent databasefeil")
      );
      return;
    }

    window.location.href =
      "event.html?id=" + encodeURIComponent(data.id);

  } catch (err) {
    console.error(err);
    showFormError(
      "En uventet feil oppstod ved lagring: " +
      (err?.message || String(err))
    );
  } finally {
    saveButton.disabled = false;
  }
});
</script>
</body>
</html>
