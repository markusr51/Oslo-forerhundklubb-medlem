<!doctype html>
<html lang="no">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Person – Oslo Førerhundklubb</title><link rel="stylesheet" href="style.css"></head>
<body>
<a class="skip-link" href="#innhold">Hopp til hovedinnhold</a>
<header class="site-header"><div class="container header-inner">
<a href="members.html" aria-label="Til medlemslisten"><img src="logo.png" alt="Oslo Førerhundklubb" class="logo"></a>
<nav aria-label="Medlemsportal" class="main-nav"><a href="members.html">Medlemmer</a><a href="new-person.html">Legg til person</a><a href="admins.html">Brukere og tilganger</a><a href="index.html" data-logout>Logg ut</a></nav>
</div></header>
<main id="innhold" class="container narrow" tabindex="-1">
<div id="fatal-status" class="fatal" role="alert" tabindex="-1" hidden></div>
<p><a href="members.html">← Tilbake til medlemslisten</a></p>
<h1 id="person-heading">Rediger person</h1>
<form id="person-form" class="panel">
<div class="field"><label for="full-name">Navn</label><input id="full-name" name="full_name" required></div>
<div class="field"><label for="person-email">E-post</label><input id="person-email" name="email" type="email"></div>
<div class="field"><label for="person-phone">Telefon</label><input id="person-phone" name="phone" inputmode="tel"></div>
<fieldset><legend>Medlemsstatus</legend><label><input type="radio" name="status" value="active"> Aktiv</label><label><input type="radio" name="status" value="inactive"> Inaktiv</label><label><input type="radio" name="status" value="resigned"> Utmeldt</label></fieldset>
<div class="actions"><button class="button" type="submit">Lagre personopplysninger</button><button class="button-danger" id="mark-resigned" type="button">Meld ut person</button></div>
<p id="form-status" class="status" role="status" aria-live="polite"></p>
</form>

<section class="panel" aria-labelledby="roles-heading">
<h2 id="roles-heading">Roller</h2>
<div id="active-roles" aria-live="polite"></div>
<form id="add-role-form">
<div class="field"><label for="add-role-select">Legg til rolle</label><select id="add-role-select"></select></div>
<button class="button" type="submit">Legg til rolle</button>
</form>
<p id="role-status" class="status" role="status" aria-live="polite"></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
</body></html>
