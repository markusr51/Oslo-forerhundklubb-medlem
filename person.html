<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Person</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
</head>
<body>
<header><h1>Person</h1></header>
<nav aria-label="Hovedmeny"><a href="members.html">Til medlemslisten</a><a href="sms.html">SMS</a>
<a href="email.html">E-post</a><button onclick="logout()">Logg ut</button></nav>
<main>
<p id="status" class="status" role="status" aria-live="polite">Laster …</p>
<form id="f">
<p><label for="name">Navn</label><br><input id="name"></p>
<p><label for="email">E-post</label><br><input id="email" type="email"></p>
<p><label for="phone">Telefon</label><br><input id="phone"></p>
<p><label for="membership">Status</label><br>
<select id="membership"><option value="active">Aktiv</option><option value="inactive">Inaktiv</option><option value="resigned">Utmeldt</option></select></p>
<button type="submit">Lagre</button>
</form>
<section class="danger"><h2>Permanent sletting</h2><button id="del">Slett person permanent</button></section>
</main>
<script>
let id=new URLSearchParams(location.search).get('id');
(async()=>{
  await requireSession();
  const {data,error}=await sb.from('persons').select('*').eq('id',id).single();
  if(error){announce(error.message);return;}
  name.value=data.full_name||'';
  email.value=data.email||'';
  phone.value=data.phone||'';
  membership.value=data.membership_status;
  announce('Person lastet.');
})();
f.addEventListener('submit',async e=>{
  e.preventDefault();
  const {error}=await sb.from('persons').update({full_name:name.value.trim(),email:email.value.trim()||null,phone:phone.value.trim()||null,membership_status:membership.value}).eq('id',id);
  announce(error?'Lagring feilet: '+error.message:'Lagret.');
});
del.addEventListener('click',async()=>{
  const me=await getCurrentAppUser();
  if(me?.app_role!=='system_admin'){announce('Bare systemadministrator kan slette permanent.');return;}
  if(!confirm('Slette personen permanent?'))return;
  const {error}=await sb.from('persons').delete().eq('id',id);
  if(error){announce('Sletting feilet: '+error.message);return;}
  location.href='members.html';
});
</script>
</body>
</html>
