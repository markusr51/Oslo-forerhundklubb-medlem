<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support og tilganger – Førerhundportalen</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js?v=0301"></script><script src="events.js?v=0301"></script><script src="portal-tools.js"></script></head>
<body><header><img src="logo.png" alt="Førerhundportalen"></header><nav id="portalNav" aria-label="Hovedmeny"></nav><main><h1>Support og tilganger</h1><p id="pageStatus" role="status" aria-live="polite"></p><div id="supportContent" hidden><p>Endringer gjelder den valgte klubben, klinikken eller personen og blir logget.</p>
<form id="clubForm"><h2>Klubber</h2><label for="clubName">Ny klubb</label><input id="clubName" required><button type="submit">Opprett klubb</button></form>
<form id="clinicCreateForm"><h2>Klinikker</h2><label for="clinicName">Ny klinikk</label><input id="clinicName" required><button type="submit">Opprett klinikk</button></form>
<section><h2>Endre klubber og klinikker</h2><div id="organisationSettings"></div></section>
<form id="createDogForm"><h2>Registrer hund</h2><label for="newDogName">Hundens navn</label><input id="newDogName" required><label for="newDogOwner">Bruker</label><select id="newDogOwner" required></select><button type="submit">Registrer hund og knytt til bruker</button></form>
<form id="dogAccessForm"><h2>Tilknytt bruker eller trener</h2><label for="supportDog">Hund</label><select id="supportDog" required></select><label for="dogPerson">Person</label><select id="dogPerson" required></select><label for="dogAccessKind">Tilknytning</label><select id="dogAccessKind"><option value="link_handler">Bruker</option><option value="link_school">Skoletrener</option><option value="link_helper">Hjelpetrener</option><option value="link_aspirant">Hjelpetreneraspirant</option></select><label for="dogClub">Klubb for trenertilknytning</label><select id="dogClub" required></select><button type="submit">Lagre tilknytning</button></form><div id="dogAccessList"></div>
<form id="accessForm"><h2>Tildel tilgang</h2><label for="personChoice">Person</label><select id="personChoice" required></select><label for="accessRole">Rolle</label><select id="accessRole"><option value="primary">Primært medlem</option><option value="secondary">Sekundært medlem</option><option value="club_admin">Klubbadministrator</option><option value="veterinarian">Veterinær</option><option value="nav">NAV</option></select><label for="supportClub">Klubb</label><select id="supportClub"></select><label for="supportClinic">Veterinærklinikk</label><select id="supportClinic"></select><button type="submit">Tildel tilgang</button></form>
<section><h2>Eksisterende tilganger</h2><div id="accessList"></div></section><section><h2>Siste tilgangsendringer</h2><div id="auditList"></div></section><p><a href="admins.html">Brukerkontoer og passordhjelp</a></p></div></main><script src="portal-support.js?v=0301"></script></body></html>
