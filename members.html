<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medlemmer – Oslo Førerhundklubb</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body>
<header><img src="logo.png" alt="Oslo Førerhundklubb"><h1>Medlemmer</h1></header>
<nav aria-label="Hovedmeny">
<a href="members.html">Medlemmer</a>
<a href="events.html">Arrangementer</a>
<a href="groups.html">Grupper og utvalg</a>
<a href="roles.html">Roller</a>
<a href="library.html">Dokumentbibliotek</a>
<a href="new-person.html">Legg til person</a><a href="sms.html">SMS</a>
<a href="email.html">E-post</a>
<a href="admins.html">Brukere og tilganger</a>
<a href="history.html">Endringshistorikk</a>
<button onclick="logout()">Logg ut</button>
</nav>
<main>
<div class="actions"><button id="exportBtn">Eksporter medlemsliste til CSV</button></div>
<p id="status" class="status" role="status" aria-live="polite">Laster medlemsregister …</p>
<p><label for="search">Søk</label><br><input id="search" type="search"></p>
<table>
<caption>Medlemsregister</caption>
<thead><tr><th>Navn</th><th>E-post</th><th>Telefon</th><th>Status</th><th>Handling</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</main>
<script>
let members=[];
(async()=>{
  await requireSession();
  const {data,error}=await sb.from('persons').select('id,full_name,email,phone,membership_status').order('full_name');
  if(error){announce('Kunne ikke hente medlemmer: '+error.message);return;}
  members=data||[];
  render(members);
  announce(members.length+' personer lastet.');
})();
function render(list){
  rows.innerHTML='';
  list.forEach(p=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${p.full_name||''}</td><td>${p.email||''}</td><td>${p.phone||''}</td><td>${p.membership_status||''}</td><td><a href="person.html?id=${encodeURIComponent(p.id)}">Åpne</a></td>`;
    rows.appendChild(tr);
  });
}
search.addEventListener('input',()=>{
  const q=search.value.toLowerCase();
  render(members.filter(p=>[p.full_name,p.email,p.phone].some(v=>(v||'').toLowerCase().includes(q))));
});
exportBtn.addEventListener('click',async()=>{
  const {data,error}=await sb.from('persons').select('full_name,email,phone,membership_status,person_roles(is_active,roles(name))').order('full_name');
  if(error){announce('Eksport feilet: '+error.message);return;}
  let csv='Navn,E-post,Telefon,Status,Roller\n';
  for(const p of data){
    const roles=(p.person_roles||[]).filter(r=>r.is_active).map(r=>r.roles?.name).filter(Boolean).join('; ');
    csv += [p.full_name,p.email,p.phone,p.membership_status,roles].map(csvCell).join(',')+'\n';
  }
  downloadBlob('oslo-forerhundklubb-medlemsliste.csv',csv,'text/csv;charset=utf-8');
  announce('Medlemslisten er eksportert.');
});
</script>
</body>
</html>
