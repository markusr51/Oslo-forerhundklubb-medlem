<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Min hund – Førerhundportalen</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js?v=0301"></script><script src="events.js?v=0301"></script><script src="portal-tools.js"></script></head>
<body><header><img src="logo.png" alt="Førerhundportalen"></header><nav id="portalNav" aria-label="Hovedmeny"></nav><main><h1>Min hund</h1><p id="pageStatus" role="status" aria-live="polite"></p><label for="dogChoice">Velg hund</label><select id="dogChoice"></select>
<div id="dogContent" hidden>
<form id="profileForm"><h2>Hundens opplysninger</h2><label for="dogName">Navn</label><input id="dogName" required>
<label for="dogChip">Chipnummer</label><input id="dogChip">
<fieldset><legend>Fødselsdato</legend><label><input id="birthdayEnabled" type="checkbox"> Registrer fødselsdato</label><div id="birthdayFields" hidden><label for="birthDay">Dag</label><select id="birthDay"></select><label for="birthMonth">Måned</label><select id="birthMonth"></select><label for="birthYear">År</label><select id="birthYear"></select></div></fieldset>
<label for="dogNotes">Generelle opplysninger</label><textarea id="dogNotes"></textarea><button type="submit">Lagre hundeopplysninger</button></form>
<form id="clinicForm" hidden><h2>Veterinærklinikk</h2><p>Valgt klinikk får tilgang til å lese, registrere, endre og slette hundeopplysninger samt laste opp og ned dokumenter.</p><label for="clinicChoice">Klinikk</label><select id="clinicChoice"></select><button type="submit">Lagre klinikkvalg</button></form>
<section><h2>Registrerte opplysninger</h2><div id="records"></div><form id="recordForm"><input id="recordId" type="hidden"><label for="recordTitle">Overskrift</label><input id="recordTitle" required><label for="recordBody">Opplysninger</label><textarea id="recordBody"></textarea><button type="submit">Lagre opplysning</button><button type="button" id="newRecord">Ny opplysning</button></form></section>
<section><h2>Dokumenter</h2><div id="documents"></div><form id="uploadForm"><label for="dogFile">Velg dokument (maks 25 MB)</label><input id="dogFile" type="file" required><button type="submit">Last opp dokument</button></form><p><a id="downloadLink" hidden>Last ned valgt dokument</a></p></section></div></main><script src="my-dog.js"></script></body></html>
