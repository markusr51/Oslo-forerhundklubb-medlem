<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velg nytt passord – Oslo Førerhundklubb</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body>
<header><h1>Velg nytt passord</h1></header>
<main>
<p id="status" class="status" role="status" aria-live="polite">
Skriv inn det nye passordet to ganger.
</p>

<form id="resetForm">
<p>
<label for="password1">Nytt passord</label><br>
<input id="password1" type="password" autocomplete="new-password" minlength="10" required>
</p>
<p>
<label for="password2">Gjenta nytt passord</label><br>
<input id="password2" type="password" autocomplete="new-password" minlength="10" required>
</p>
<button type="submit">Lagre nytt passord</button>
</form>
</main>

<script>
resetForm.onsubmit = async e=>{
  e.preventDefault();

  if (password1.value !== password2.value) {
    announce("Passordene er ikke like.");
    return;
  }

  if (password1.value.length < 10) {
    announce("Passordet må være minst 10 tegn.");
    return;
  }

  announce("Lagrer nytt passord …");

  const {error} = await sb.auth.updateUser({
    password: password1.value
  });

  if (error) {
    announce("Kunne ikke endre passord: " + error.message);
    return;
  }

  announce("Passordet er endret. Du sendes til portalen.");
  setTimeout(async()=>{
    location.href = await portalHome();
  },800);
};
</script>
</body>
</html>
