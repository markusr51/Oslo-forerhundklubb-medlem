<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glemt passord – Oslo Førerhundklubb</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body>
<header><h1>Glemt passord</h1></header>
<main>
<p id="status" class="status" role="status" aria-live="polite">
Skriv inn e-postadressen som er registrert hos Oslo Førerhundklubb.
</p>

<form id="forgotForm">
<p>
<label for="email">E-post</label><br>
<input id="email" type="email" autocomplete="email" required>
</p>
<button type="submit">Send lenke for nytt passord</button>
</form>

<p><a href="index.html">Tilbake til innlogging</a></p>
</main>

<script>
forgotForm.onsubmit = async e=>{
  e.preventDefault();

  announce("Sender e-post …");

  const redirectTo =
    new URL("reset-password.html", location.href).href;

  const {error} = await sb.auth.resetPasswordForEmail(
    email.value.trim(),
    { redirectTo }
  );

  if (error) {
    announce("Kunne ikke sende lenken: " + error.message);
    return;
  }

  announce("Hvis e-postadressen har en aktiv brukerkonto, er en lenke for nytt passord sendt.");
  forgotForm.reset();
};
</script>
</body>
</html>
