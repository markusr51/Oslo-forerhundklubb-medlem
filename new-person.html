<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legg til person</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
</head>
<body>
<header><h1>Legg til person</h1></header>
<nav aria-label="Hovedmeny">
<a href="admin-dashboard.html">Oversikt</a><a href="members.html">Medlemmer</a>
<a href="events.html">Arrangementer</a>
<a href="event-templates.html">Arrangementsmaler</a>
<a href="groups.html">Grupper og utvalg</a>
<a href="roles.html">Roller</a>
<a href="library.html">Dokumentbibliotek</a>
<a href="helper-settlement.html">Hjelpetreneroppgjør</a><a href="sms.html">SMS</a>
<a href="email.html">E-post</a>
<a href="communication-history.html">Kommunikasjonshistorikk</a><a href="admins.html">Brukere og tilganger</a><a href="history.html">Endringshistorikk</a><button onclick="logout()">Logg ut</button></nav>
<main>
<p id="status" class="status" role="status" aria-live="polite"></p>
<form id="f">
<p><label for="name">Navn</label><br><input id="name" required></p>
<p><label for="email">E-post</label><br><input id="email" type="email"></p>
<p><label for="phone">Telefon</label><br><input id="phone"></p>
<button type="submit">Opprett person</button>
</form>
</main>
<script>
const personForm = document.getElementById("f");
const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const phoneInput = document.getElementById("phone");

(async()=>{
  try {
    await requireSession();
  } catch (e) {
    console.error(e);
    announce("Kunne ikke kontrollere innloggingen.");
  }
})();

personForm.addEventListener("submit", async e => {
  e.preventDefault();

  const fullName = nameInput.value.trim();
  const emailValue = emailInput.value.trim();
  const phoneValue = phoneInput.value.trim();

  if (!fullName) {
    announce("Navn må fylles ut.");
    nameInput.focus();
    return;
  }

  announce("Oppretter person …");

  const {error} = await sb.from("persons").insert({
    full_name: fullName,
    email: emailValue || null,
    phone: phoneValue || null,
    membership_status: "active"
  });

  if (error) {
    console.error(error);
    announce("Kunne ikke opprette person: " + error.message);
    return;
  }

  personForm.reset();
  announce("Personen er opprettet.");
  nameInput.focus();
});
</script>
</body></html>
