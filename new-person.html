<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legg til person</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
<script>
(async()=>{
  try {
    await requireSession();
    const __accessUser = await getCurrentAppUser();

    if (
      !__accessUser ||
      !["admin","system_admin"].includes(__accessUser.app_role)
    ) {
      await sb.auth.signOut();
      location.replace("index.html?forbidden=1");
      return;
    }

    document.documentElement.dataset.adminAccess = "granted";
  } catch (error) {
    console.error("Administratortilgang kunne ikke bekreftes:", error);
    try { await sb.auth.signOut(); } catch (_) {}
    location.replace("index.html?forbidden=1");
  }
})();
</script>

</head>
<body>
<h2 class="main-menu-heading">Hovedmeny</h2>
<nav aria-label="Hovedmeny">
<a href="admin-dashboard.html">Oversikt</a><a href="members.html">Medlemmer</a>
<a href="events.html">Arrangementer</a>
<a href="event-templates.html">Arrangementsmaler</a>
<a href="groups.html">Grupper og utvalg</a>
<a href="roles.html">Roller</a>
<a href="library.html">Dokumentbibliotek</a>
<a href="helper-settlement.html">Hjelpetreneroppgjør</a><a href="sms.html">SMS</a>
<a href="email.html">E-post</a>
<a href="communication-history.html">Kommunikasjonshistorikk</a><a href="admins.html">Brukere og tilganger</a><a href="history.html">Endringshistorikk</a><button onclick="logout()">Logg ut</button></nav>
<main>
<h1>Legg til person</h1>

<p id="status" class="status" role="status" aria-live="polite"></p>
<form id="personForm" novalidate>
<p><label for="personName">Navn</label><br><input id="personName" name="personName" required></p>
<p><label for="personEmail">E-post</label><br><input id="personEmail" name="personEmail" type="email"></p>
<p><label for="personPhone">Telefon</label><br><input id="personPhone" name="personPhone"></p>
<button id="createPersonButton" type="button">Opprett person</button>
</form>
<p id="createdPersonActions" hidden>
<a id="createdPersonLink" href="members.html">Gå til personen</a>
</p>
</main>
<script>
const personForm = document.getElementById("personForm");
const personName = document.getElementById("personName");
const personEmail = document.getElementById("personEmail");
const personPhone = document.getElementById("personPhone");
const createPersonButton = document.getElementById("createPersonButton");
const statusElement = document.getElementById("status");

function setStatus(message) {
  if (statusElement) statusElement.textContent = message;
  if (typeof announce === "function") {
    try { announce(message); } catch (_) {}
  }
}

async function createPerson() {
  createPersonButton.disabled = true;

  try {
    setStatus("Kontrollerer innlogging …");

    if (typeof sb === "undefined" || !sb) {
      throw new Error("Supabase-klienten ble ikke lastet.");
    }

    const {data:{session}, error:sessionError} = await sb.auth.getSession();
    if (sessionError) throw sessionError;
    if (!session) throw new Error("Du er ikke innlogget.");

    const fullName = personName.value.trim();
    const email = personEmail.value.trim();
    const phone = personPhone.value.trim();

    if (!fullName) {
      setStatus("Navn må fylles ut.");
      personName.focus();
      return;
    }

    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setStatus("E-postadressen ser ikke gyldig ut.");
      personEmail.focus();
      return;
    }

    setStatus("Oppretter person …");

    const {data, error} = await sb
      .from("persons")
      .insert({
        full_name: fullName,
        email: email || null,
        phone: phone || null,
        membership_status: "active"
      })
      .select("id,full_name")
      .single();

    if (error) throw error;

    personForm.reset();
    if (data?.id) {
      createdPersonLink.href = `person.html?id=${encodeURIComponent(data.id)}`;
      createdPersonActions.hidden = false;
    }
    setStatus(`Personen ${data?.full_name || fullName} er opprettet. Du kan nå gå til personen for å tildele roller eller portaltilgang.`);
    createdPersonLink.focus();
  } catch (error) {
    console.error("Opprett person feilet:", error);
    const message = "Kunne ikke opprette person: " + (error?.message || String(error));
    setStatus(message);
    alert(message);
  } finally {
    createPersonButton.disabled = false;
  }
}

createPersonButton.addEventListener("click", createPerson);

personForm.addEventListener("submit", e => {
  e.preventDefault();
  createPerson();
});

(async()=>{
  try {
    if (typeof requireSession === "function") {
      await requireSession();
    }
    setStatus("Klar til å opprette person.");
  } catch (error) {
    console.error(error);
    const message = "Kunne ikke kontrollere innloggingen: " + (error?.message || String(error));
    setStatus(message);
    alert(message);
  }
})();
</script>
</body></html>
